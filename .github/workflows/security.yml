name: Seguridad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretos:
    name: Gitleaks (secretos en todo el historial)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El token del PR es de solo lectura: el resultado se ve en el job, no como comentario.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  dependencias:
    name: OSV (dependencias, incluidas las de desarrollo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Las vulnerabilidades altas y críticas bloquean; las excepciones, solo temporales y
      # aprobadas por el equipo, viven en osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=proyecto/pnpm-lock.yaml
            --config=osv-scanner.toml

  trivy:
    name: Trivy (vulnerabilidades y secretos del código)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # El escaneo de las imágenes de API y worker llega con sus Dockerfiles (T042).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: proyecto
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,.next,.turbo,coverage,dist

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  seguridad:
    name: Seguridad
    # Check agregado fail-closed para la protección de main.
    needs: [secretos, dependencias, trivy, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exigir que todos los análisis hayan pasado
        env:
          SECRETOS: ${{ needs.secretos.result }}
          DEPENDENCIAS: ${{ needs.dependencias.result }}
          TRIVY: ${{ needs.trivy.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          echo "secretos=$SECRETOS dependencias=$DEPENDENCIAS trivy=$TRIVY codeql=$CODEQL"
          for result in "$SECRETOS" "$DEPENDENCIAS" "$TRIVY" "$CODEQL"; do
            if [ "$result" != "success" ]; then
              echo "::error::Algún análisis de seguridad no pasó (resultado: $result)."
              exit 1
            fi
          done
