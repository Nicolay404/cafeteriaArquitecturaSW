# SonarQube Cloud. projectKey y organization CONFIRMADOS con la API pública de Sonar el 2026-11-18.
# Base del análisis: proyecto/. Las rutas son relativas a este directorio, sin repetir "proyecto/".
sonar.projectKey=Nicolay404_cafeteriaArquitecturaSW
sonar.organization=nicolay404-talenttrack
sonar.projectName=Cafetería
sonar.sourceEncoding=UTF-8

# Código y pruebas comparten carpetas: las pruebas se distinguen por nombre.
sonar.sources=apps,packages,scripts
sonar.tests=apps,packages,scripts,tests
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/next-env.d.ts

# Un único informe LCOV, ya normalizado por `pnpm coverage:merge` (T016).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,tests/**,**/*.config.ts,**/*.config.mjs,**/*.config.cjs,**/jest.config.ts

# Umbral sobre el código NUEVO respecto de main (constitución VI). Lo aplica el Quality Gate de
# Sonar; scripts/ci/quality-gate.ts documenta y prueba los mismos mínimos.
sonar.newCode.referenceBranch=main
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
