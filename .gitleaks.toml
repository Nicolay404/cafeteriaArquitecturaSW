# Gitleaks: reglas por defecto más UNA excepción mínima y justificada.
# Sintaxis [allowlist] (válida desde 8.x): la acción de GitHub instala una versión anterior a 8.25,
# que ignora en silencio [[allowlists]].
[extend]
useDefault = true

[allowlist]
description = "El identificador del proyecto de Sonar es público (aparece en la URL del panel), no una credencial."
regexTarget = "match"
regexes = ['''^sonar\.projectKey=Nicolay404_cafeteriaArquitecturaSW$''']
